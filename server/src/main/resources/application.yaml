ktor:
  deployment:
    port: 8080
    host: 0.0.0.0

database:
  jdbcUrl: $DATABASE_JDBC_URL
  username: $DATABASE_USERNAME
  password: $DATABASE_PASSWORD
  maximumPoolSize: ${?DATABASE_MAX_POOL_SIZE}
  minimumIdle: ${?DATABASE_MIN_IDLE}
  connectionTimeout: ${?DATABASE_CONNECTION_TIMEOUT}
  validationTimeout: ${?DATABASE_VALIDATION_TIMEOUT}
  idleTimeout: ${?DATABASE_IDLE_TIMEOUT}
  maxLifetime: ${?DATABASE_MAX_LIFETIME}
  statementTimeoutMs: ${?DATABASE_STATEMENT_TIMEOUT_MS}

jwt:
  secret: $JWT_SECRET
  issuer: "omniasset"
  audience: "omniasset-clients"
  validityMs: ${?JWT_VALIDITY_MS}
