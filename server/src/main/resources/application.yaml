ktor:
  deployment:
    port: 8080
    host: 0.0.0.0

database:
  jdbcUrl: $DATABASE_JDBC_URL
  username: $DATABASE_USERNAME
  password: $DATABASE_PASSWORD
  maximumPoolSize: 15
  minimumIdle: 5
  connectionTimeout: 5000
  validationTimeout: 3000
  idleTimeout: 600000
  maxLifetime: 1800000
  statementTimeoutMs: 10000

jwt:
  secret: $JWT_SECRET
  issuer: "omniasset"
  audience: "omniasset-clients"
  validityMs: 3600000
